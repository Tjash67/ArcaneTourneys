<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Watch elite Warzone teams compete live on Twitch, YouTube, and Kick.">
    <title>Live Streams - Arcane Tournaments</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #000000; --bg-card: #0a0d12; --cyan-glow: #00d9ff; --cyan-bright: #00f0ff;
            --metal-light: #c5d1dd; --text-primary: #e8f2f7; --text-secondary: #8b9daa;
            --border-glow: rgba(0, 217, 255, 0.2); --glow-effect: 0 0 20px rgba(0, 217, 255, 0.4);
            --red-live: #ff0055;
        }
        body { font-family: 'Rajdhani', sans-serif; background: var(--bg-dark); color: var(--text-primary); line-height: 1.6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        .tech-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px); background-size: 60px 60px; z-index: 0; pointer-events: none; }
        .tech-grid::before { content: ''; position: absolute; width: 100%; height: 100%; background: linear-gradient(180deg, transparent, rgba(0, 217, 255, 0.05) 50%, transparent); animation: scanline 8s linear infinite; }
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .particle { position: absolute; width: 3px; height: 3px; background: var(--cyan-glow); border-radius: 50%; box-shadow: 0 0 10px var(--cyan-glow); opacity: 0; animation: particleRise linear infinite; }
        @keyframes particleRise { 0% { transform: translateY(100vh); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-100px) translateX(var(--drift)); opacity: 0; } }
        
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(5, 5, 8, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-glow); box-shadow: 0 4px 30px rgba(0, 217, 255, 0.1); }
        .nav-container { max-width: 1400px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.25rem; font-weight: 900; letter-spacing: 2px; color: var(--cyan-bright); text-shadow: 0 0 10px var(--cyan-glow); text-transform: uppercase; z-index: 1001; }
        .hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 8px; z-index: 1001; }
        .hamburger span { width: 25px; height: 3px; background: var(--cyan-bright); border-radius: 2px; transition: all 0.3s ease; box-shadow: 0 0 10px var(--cyan-glow); }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(8px, 8px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(7px, -7px); }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; transition: all 0.3s ease; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; position: relative; padding: 0.5rem 0; }
        .nav-links a::before { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: var(--cyan-glow); box-shadow: var(--glow-effect); transition: width 0.3s ease; }
        .nav-links a:hover { color: var(--cyan-bright); text-shadow: 0 0 10px var(--cyan-glow); }
        .nav-links a:hover::before { width: 100%; }
        
        main { position: relative; z-index: 10; max-width: 1600px; margin: 0 auto; padding: 6rem 1.5rem 4rem; }
        
        .page-header { text-align: center; margin-bottom: 3rem; }
        .page-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1.5rem; background: rgba(255, 0, 85, 0.15); border: 1px solid rgba(255, 0, 85, 0.3); border-radius: 50px; font-size: 0.85rem; font-weight: 700; color: var(--red-live); margin-bottom: 1.5rem; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 0 20px rgba(255, 0, 85, 0.3); }
        .live-dot { width: 8px; height: 8px; background: var(--red-live); border-radius: 50%; animation: livePulse 2s ease-in-out infinite; }
        @keyframes livePulse { 0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px var(--red-live); } 50% { opacity: 0.7; transform: scale(1.3); box-shadow: 0 0 20px var(--red-live); } }
        .page-title { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 6vw, 4rem); font-weight: 900; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 3px; color: var(--metal-light); }
        .page-subtitle { font-size: 1.125rem; color: var(--text-secondary); font-weight: 500; }
        
        .team-section { margin-bottom: 3rem; }
        .team-header { background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem; }
        .team-info { flex: 1; min-width: 200px; }
        .team-name { font-family: 'Orbitron', sans-serif; font-size: clamp(1.25rem, 4vw, 2rem); font-weight: 900; margin-bottom: 0.5rem; color: var(--cyan-bright); text-shadow: 0 0 20px var(--cyan-glow); text-transform: uppercase; letter-spacing: 2px; }
        .team-tournament { color: var(--text-secondary); font-size: 1rem; font-weight: 600; }
        .team-stats { display: flex; gap: 2rem; flex-wrap: wrap; }
        .team-stat { text-align: center; }
        .team-stat-value { font-family: 'Orbitron', sans-serif; font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 900; color: var(--text-primary); display: block; }
        .team-stat-label { color: var(--text-secondary); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .stream-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 1.5rem; }
        .stream-card { background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 16px; overflow: hidden; transition: all 0.3s ease; }
        .stream-card:hover { border-color: var(--cyan-glow); box-shadow: var(--glow-effect); transform: translateY(-5px); }
        .stream-card.live { border-color: rgba(255, 0, 85, 0.4); }
        .stream-card.live:hover { box-shadow: 0 0 30px rgba(255, 0, 85, 0.4); }
        .stream-thumbnail { position: relative; width: 100%; aspect-ratio: 16 / 9; background: linear-gradient(135deg, #0a0d12, rgba(0, 217, 255, 0.1)); display: flex; align-items: center; justify-content: center; }
        .thumbnail-placeholder { font-size: 3rem; opacity: 0.2; }
        .live-badge { position: absolute; top: 1rem; left: 1rem; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; background: rgba(255, 0, 85, 0.95); backdrop-filter: blur(10px); border-radius: 50px; font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; color: white; box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); }
        .live-badge-dot { width: 6px; height: 6px; background: white; border-radius: 50%; animation: livePulse 2s infinite; }
        .platform-badge { position: absolute; top: 1rem; right: 1rem; padding: 0.375rem 0.75rem; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); border-radius: 8px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; border: 1px solid; }
        .platform-twitch { color: #9146ff; border-color: #9146ff; }
        .platform-youtube { color: #ff0000; border-color: #ff0000; }
        .platform-kick { color: #53fc18; border-color: #53fc18; }
        .stream-content { padding: 1.5rem; }
        .player-name { font-family: 'Orbitron', sans-serif; font-size: 1.125rem; font-weight: 700; margin-bottom: 0.375rem; color: var(--metal-light); }
        .activision-id { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.25rem; }
        .player-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; padding: 1.25rem 0; border-top: 1px solid var(--border-glow); border-bottom: 1px solid var(--border-glow); margin-bottom: 1.25rem; }
        .player-stat { text-align: center; }
        .player-stat-value { font-family: 'Orbitron', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--text-primary); display: block; }
        .player-stat-label { color: var(--text-secondary); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .stream-link { display: block; width: 100%; padding: 1rem; background: transparent; color: var(--cyan-bright); border: 1px solid var(--cyan-glow); border-radius: 8px; font-weight: 700; text-align: center; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; }
        .stream-link:hover { background: rgba(0, 217, 255, 0.1); box-shadow: var(--glow-effect); }
        .stream-link.offline { background: transparent; color: var(--text-secondary); border-color: rgba(139, 157, 170, 0.2); cursor: not-allowed; }
        
        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-secondary); }
        .empty-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.3; }
        footer { position: relative; z-index: 10; text-align: center; padding: 3rem 2rem; margin-top: 6rem; border-top: 1px solid var(--border-glow); color: var(--text-secondary); }
        
        @media (max-width: 768px) {
            .hamburger { display: flex; }
            .nav-links { position: fixed; top: 70px; right: -100%; width: 250px; height: calc(100vh - 70px); background: rgba(10, 13, 18, 0.98); backdrop-filter: blur(20px); flex-direction: column; gap: 0; padding: 2rem 0; border-left: 1px solid var(--border-glow); box-shadow: -4px 0 30px rgba(0, 217, 255, 0.1); }
            .nav-links.active { right: 0; }
            .nav-links li { width: 100%; }
            .nav-links a { display: block; padding: 1.25rem 2rem; border-bottom: 1px solid rgba(0, 217, 255, 0.05); }
            .nav-links a::before { display: none; }
            .nav-links a:hover { background: rgba(0, 217, 255, 0.05); }
            main { padding: 5rem 1rem 3rem; }
            .team-header { padding: 1.25rem; }
            .team-stats { width: 100%; justify-content: space-around; gap: 1rem; }
        }
        
        @media (min-width: 769px) {
            main { padding: 7rem 2rem 4rem; }
            .team-section { margin-bottom: 4rem; }
            .stream-grid { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 2rem; }
        }
    </style>
</head>
<body>
    <div class="tech-grid"></div>
    <div class="particles" id="particles"></div>
    <nav>
        <div class="nav-container">
            <div class="logo">ARCANE TOURNEYS</div>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="streams.html">Live Streams</a></li>
                <li><a href="standings.html">Standings</a></li>
                <li><a href="rules.html">Rules</a></li>
            </ul>
        </div>
    </nav>
    <main>
        <div class="page-header">
            <div class="page-badge"><span class="live-dot"></span>LIVE NOW</div>
            <h1 class="page-title">Watch Teams Compete</h1>
            <p class="page-subtitle">Follow elite squads on Twitch, YouTube & Kick</p>
        </div>
        <div id="teamsContainer"></div>
    </main>
    <footer><p>&copy; 2025 Arcane Tournaments. Elite Warzone competition platform.</p></footer>
    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        hamburger.addEventListener('click', () => { hamburger.classList.toggle('active'); navLinks.classList.toggle('active'); });
        navLinks.querySelectorAll('a').forEach(link => { link.addEventListener('click', () => { hamburger.classList.remove('active'); navLinks.classList.remove('active'); }); });
        document.addEventListener('click', (e) => { if (!hamburger.contains(e.target) && !navLinks.contains(e.target)) { hamburger.classList.remove('active'); navLinks.classList.remove('active'); } });
        
        function createParticles() {
            const c = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.setProperty('--drift', (Math.random() * 200 - 100) + 'px');
                p.style.animationDuration = (Math.random() * 15 + 10) + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                c.appendChild(p);
            }
        }
        
        function getPlatform(url) {
            if (!url) return null;
            const u = url.toLowerCase();
            if (u.includes('twitch.tv')) return 'twitch';
            if (u.includes('youtube.com') || u.includes('youtu.be')) return 'youtube';
            if (u.includes('kick.com')) return 'kick';
            return 'other';
        }
        
        async function loadStreams() {
            try {
                const r = await fetch('tournament_data.json');
                const d = await r.json();
                const tc = document.getElementById('teamsContainer');
                tc.innerHTML = '';
                
                // Group teams by tournament
                const teamsByTournament = {};
                Object.entries(d.teams || {}).forEach(([tid, t]) => {
                    const tour = d.tournaments[t.tournament_id];
                    if (!tour) return;
                    // Only show teams from active or registration tournaments
                    if (tour.status !== 'active' && tour.status !== 'registration') return;
                    if (!teamsByTournament[t.tournament_id]) {
                        teamsByTournament[t.tournament_id] = { tournament: tour, teams: {} };
                    }
                    teamsByTournament[t.tournament_id].teams[tid] = t;
                });
                
                // Render each tournament's teams
                Object.entries(teamsByTournament).forEach(([tourId, td]) => {
                    Object.entries(td.teams).forEach(([teamId, team]) => {
                        tc.innerHTML += createTeamSection(teamId, team, td.tournament);
                    });
                });
                
                if (!tc.innerHTML) {
                    tc.innerHTML = '<div class="empty-state"><div class="empty-icon">📺</div><p>No teams registered yet</p></div>';
                }
            } catch (e) {
                console.error('Error:', e);
                document.getElementById('teamsContainer').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>Unable to load streams</p></div>';
            }
        }
        
        function createTeamSection(teamId, team, tournament) {
            const totalKills = (team.matches_played || []).reduce((sum, m) => sum + (m.kills || 0), 0);
            const avgPlace = team.matches_played && team.matches_played.length > 0 
                ? (team.matches_played.reduce((sum, m) => sum + m.placement, 0) / team.matches_played.length).toFixed(1) 
                : 'N/A';
            
            let streamCards = '';
            
            // Get streams from the correct location (team.streams object)
            const streams = team.streams || {};
            const streamUrls = [
                streams.player1 || '',
                streams.player2 || '',
                streams.player3 || ''
            ];
            
            (team.players || []).forEach((player, i) => {
                const streamUrl = streamUrls[i];
                const platform = getPlatform(streamUrl);
                const isLive = streamUrl && Math.random() > 0.6; // Simulated - replace with actual API check
                const playerKills = Math.floor(totalKills / 3);
                const viewers = isLive ? Math.floor(Math.random() * 1500) + 200 : 0;
                
                let platformBadge = '';
                if (platform === 'twitch') platformBadge = '<div class="platform-badge platform-twitch">Twitch</div>';
                else if (platform === 'youtube') platformBadge = '<div class="platform-badge platform-youtube">YouTube</div>';
                else if (platform === 'kick') platformBadge = '<div class="platform-badge platform-kick">Kick</div>';
                
                const playerName = player.split('#')[0] || player;
                
                streamCards += `
                    <div class="stream-card ${isLive ? 'live' : ''}">
                        <div class="stream-thumbnail">
                            ${isLive ? '<div class="live-badge"><span class="live-badge-dot"></span>LIVE</div>' : ''}
                            ${platformBadge}
                            <div class="thumbnail-placeholder">🎮</div>
                        </div>
                        <div class="stream-content">
                            <div class="player-name">${playerName}</div>
                            <div class="activision-id">${player}</div>
                            <div class="player-stats">
                                <div class="player-stat">
                                    <span class="player-stat-value">${playerKills}</span>
                                    <span class="player-stat-label">Kills</span>
                                </div>
                                <div class="player-stat">
                                    <span class="player-stat-value">${(team.matches_played || []).length}</span>
                                    <span class="player-stat-label">Matches</span>
                                </div>
                                <div class="player-stat">
                                    <span class="player-stat-value">${isLive ? viewers.toLocaleString() : '—'}</span>
                                    <span class="player-stat-label">Viewers</span>
                                </div>
                            </div>
                            <a href="${isLive && streamUrl ? streamUrl : 'javascript:void(0)'}" 
                               class="stream-link ${isLive && streamUrl ? '' : 'offline'}" 
                               ${isLive && streamUrl ? 'target="_blank"' : 'onclick="return false;"'}>
                                ${isLive && streamUrl ? 'Watch Stream' : streamUrl ? 'Offline' : 'No Stream'}
                            </a>
                        </div>
                    </div>
                `;
            });
            
            return `
                <section class="team-section">
                    <div class="team-header">
                        <div class="team-info">
                            <h2 class="team-name">${team.name}</h2>
                            <p class="team-tournament">${tournament.name}</p>
                        </div>
                        <div class="team-stats">
                            <div class="team-stat">
                                <span class="team-stat-value">${team.total_points || 0}</span>
                                <span class="team-stat-label">Points</span>
                            </div>
                            <div class="team-stat">
                                <span class="team-stat-value">#${avgPlace}</span>
                                <span class="team-stat-label">Avg Place</span>
                            </div>
                            <div class="team-stat">
                                <span class="team-stat-value">${totalKills}</span>
                                <span class="team-stat-label">Eliminations</span>
                            </div>
                        </div>
                    </div>
                    <div class="stream-grid">${streamCards}</div>
                </section>
            `;
        }
        
        window.addEventListener('load', () => {
            createParticles();
            loadStreams();
            setInterval(loadStreams, 30000); // Refresh every 30 seconds
        });
    </script>
</body>
</html>
