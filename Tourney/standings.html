<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Live tournament standings and leaderboards. Track team rankings in real-time.">
    <title>Standings - Arcane Tournaments</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg-dark: #000000; --bg-card: #0a0d12; --cyan-glow: #00d9ff; --cyan-bright: #00f0ff; --metal-light: #c5d1dd; --text-primary: #e8f2f7; --text-secondary: #8b9daa; --border-glow: rgba(0, 217, 255, 0.2); --glow-effect: 0 0 20px rgba(0, 217, 255, 0.4); --gold: #ffd700; --silver: #c0c0c0; --bronze: #cd7f32; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--bg-dark); color: var(--text-primary); line-height: 1.6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        .tech-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px); background-size: 60px 60px; z-index: 0; pointer-events: none; }
        .tech-grid::before { content: ''; position: absolute; width: 100%; height: 100%; background: linear-gradient(180deg, transparent, rgba(0, 217, 255, 0.05) 50%, transparent); animation: scanline 8s linear infinite; }
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .particle { position: absolute; width: 3px; height: 3px; background: var(--cyan-glow); border-radius: 50%; box-shadow: 0 0 10px var(--cyan-glow); opacity: 0; animation: particleRise linear infinite; }
        @keyframes particleRise { 0% { transform: translateY(100vh); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-100px) translateX(var(--drift)); opacity: 0; } }
        
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(5, 5, 8, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-glow); box-shadow: 0 4px 30px rgba(0, 217, 255, 0.1); }
        .nav-container { max-width: 1400px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.25rem; font-weight: 900; letter-spacing: 2px; color: var(--cyan-bright); text-shadow: 0 0 10px var(--cyan-glow); text-transform: uppercase; z-index: 1001; }
        .hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 8px; z-index: 1001; }
        .hamburger span { width: 25px; height: 3px; background: var(--cyan-bright); border-radius: 2px; transition: all 0.3s ease; box-shadow: 0 0 10px var(--cyan-glow); }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(8px, 8px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(7px, -7px); }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; transition: all 0.3s ease; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; position: relative; padding: 0.5rem 0; }
        .nav-links a::before { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: var(--cyan-glow); box-shadow: var(--glow-effect); transition: width 0.3s ease; }
        .nav-links a:hover { color: var(--cyan-bright); text-shadow: 0 0 10px var(--cyan-glow); }
        .nav-links a:hover::before { width: 100%; }
        
        main { position: relative; z-index: 10; max-width: 1400px; margin: 0 auto; padding: 6rem 1.5rem 4rem; }
        .page-header { text-align: center; margin-bottom: 3rem; }
        .page-title { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 6vw, 4rem); font-weight: 900; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 3px; color: var(--metal-light); }
        .page-subtitle { font-size: 1.125rem; color: var(--text-secondary); font-weight: 500; }
        
        .tournament-selector { margin-bottom: 2rem; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
        .tournament-tab { padding: 0.875rem 1.5rem; background: transparent; border: 1px solid var(--border-glow); border-radius: 8px; color: var(--text-secondary); font-family: 'Rajdhani', sans-serif; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.3s ease; }
        .tournament-tab:hover { border-color: var(--cyan-glow); color: var(--cyan-bright); }
        .tournament-tab.active { background: rgba(0, 217, 255, 0.1); border-color: var(--cyan-glow); color: var(--cyan-bright); box-shadow: var(--glow-effect); }
        
        .leaderboard { background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 16px; overflow-x: auto; }
        .leaderboard-header { display: grid; grid-template-columns: 60px 1fr 100px 100px 100px; gap: 1rem; padding: 1.25rem 1.5rem; background: rgba(0, 10, 15, 0.5); border-bottom: 1px solid var(--border-glow); min-width: 600px; }
        .leaderboard-header-cell { color: var(--text-secondary); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .leaderboard-row { display: grid; grid-template-columns: 60px 1fr 100px 100px 100px; gap: 1rem; padding: 1.25rem 1.5rem; border-bottom: 1px solid rgba(0, 217, 255, 0.05); transition: all 0.3s ease; align-items: center; min-width: 600px; }
        .leaderboard-row:last-child { border-bottom: none; }
        .leaderboard-row:hover { background: rgba(0, 217, 255, 0.05); }
        .leaderboard-row.top-3 { background: rgba(0, 217, 255, 0.03); }
        .rank { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900; color: var(--text-secondary); }
        .rank.first { color: var(--gold); text-shadow: 0 0 15px var(--gold); }
        .rank.second { color: var(--silver); text-shadow: 0 0 15px var(--silver); }
        .rank.third { color: var(--bronze); text-shadow: 0 0 15px var(--bronze); }
        .team-name-cell { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
        .team-name { font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 700; color: var(--text-primary); }
        .match-point-badge { padding: 0.25rem 0.75rem; background: rgba(0, 255, 100, 0.15); border: 1px solid rgba(0, 255, 100, 0.3); border-radius: 50px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #00ff64; box-shadow: 0 0 10px rgba(0, 255, 100, 0.3); white-space: nowrap; }
        .stat-cell { font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 700; color: var(--cyan-bright); text-align: center; }
        
        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-secondary); }
        .empty-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.3; }
        footer { position: relative; z-index: 10; text-align: center; padding: 3rem 2rem; margin-top: 6rem; border-top: 1px solid var(--border-glow); color: var(--text-secondary); }
        
        @media (max-width: 768px) {
            .hamburger { display: flex; }
            .nav-links { position: fixed; top: 70px; right: -100%; width: 250px; height: calc(100vh - 70px); background: rgba(10, 13, 18, 0.98); backdrop-filter: blur(20px); flex-direction: column; gap: 0; padding: 2rem 0; border-left: 1px solid var(--border-glow); box-shadow: -4px 0 30px rgba(0, 217, 255, 0.1); }
            .nav-links.active { right: 0; }
            .nav-links li { width: 100%; }
            .nav-links a { display: block; padding: 1.25rem 2rem; border-bottom: 1px solid rgba(0, 217, 255, 0.05); }
            .nav-links a::before { display: none; }
            .nav-links a:hover { background: rgba(0, 217, 255, 0.05); }
            main { padding: 5rem 1rem 3rem; }
            .leaderboard { border-radius: 12px; }
            .leaderboard-header, .leaderboard-row { grid-template-columns: 50px 1fr 80px 80px; gap: 0.75rem; padding: 1rem; font-size: 0.85rem; }
            .hide-mobile { display: none; }
            .rank { font-size: 1.25rem; }
            .team-name { font-size: 0.9rem; }
            .stat-cell { font-size: 0.9rem; }
        }
        
        @media (min-width: 769px) {
            main { padding: 7rem 2rem 4rem; }
            .leaderboard-header, .leaderboard-row { grid-template-columns: 80px 1fr 120px 120px 120px; }
        }
    </style>
</head>
<body>
    <div class="tech-grid"></div>
    <div class="particles" id="particles"></div>
    <nav>
        <div class="nav-container">
            <div class="logo">ARCANE TOURNEYS</div>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="streams.html">Live Streams</a></li>
                <li><a href="standings.html">Standings</a></li>
                <li><a href="rules.html">Rules</a></li>
            </ul>
        </div>
    </nav>
    <main>
        <div class="page-header">
            <h1 class="page-title">⚡ LEADERBOARD ⚡</h1>
            <p class="page-subtitle">Live tournament standings</p>
        </div>
        <div class="tournament-selector" id="tournamentSelector"></div>
        <div class="leaderboard">
            <div class="leaderboard-header">
                <div class="leaderboard-header-cell">Rank</div>
                <div class="leaderboard-header-cell">Team</div>
                <div class="leaderboard-header-cell">Points</div>
                <div class="leaderboard-header-cell hide-mobile">Matches</div>
                <div class="leaderboard-header-cell">Kills</div>
            </div>
            <div id="standingsContent"></div>
        </div>
    </main>
    <footer><p>&copy; 2025 Arcane Tournaments. Elite Warzone competition platform.</p></footer>
    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        hamburger.addEventListener('click', () => { hamburger.classList.toggle('active'); navLinks.classList.toggle('active'); });
        navLinks.querySelectorAll('a').forEach(link => { link.addEventListener('click', () => { hamburger.classList.remove('active'); navLinks.classList.remove('active'); }); });
        document.addEventListener('click', (e) => { if (!hamburger.contains(e.target) && !navLinks.contains(e.target)) { hamburger.classList.remove('active'); navLinks.classList.remove('active'); } });
        
        function createParticles() {
            const c = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.setProperty('--drift', (Math.random() * 200 - 100) + 'px');
                p.style.animationDuration = (Math.random() * 15 + 10) + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                c.appendChild(p);
            }
        }
        
        let currentTournamentId = null;
        let tournamentData = null;
        
        async function loadStandings() {
            try {
                const r = await fetch('tournament_data.json');
                tournamentData = await r.json();
                
                const sel = document.getElementById('tournamentSelector');
                sel.innerHTML = '';
                
                // Get tournaments that should show standings (active or registration with teams)
                const validTournaments = Object.entries(tournamentData.tournaments || {}).filter(([id, t]) => {
                    return t.status === 'active' || t.status === 'registration' || t.status === 'upcoming';
                });
                
                validTournaments.forEach(([id, t]) => {
                    const tab = document.createElement('button');
                    tab.className = 'tournament-tab';
                    tab.textContent = t.name;
                    tab.onclick = () => showTournament(id);
                    
                    if (!currentTournamentId) {
                        currentTournamentId = id;
                        tab.classList.add('active');
                    } else if (id === currentTournamentId) {
                        tab.classList.add('active');
                    }
                    sel.appendChild(tab);
                });
                
                if (currentTournamentId) {
                    showTournament(currentTournamentId);
                } else {
                    document.getElementById('standingsContent').innerHTML = '<div class="empty-state"><div class="empty-icon">🏆</div><p>No active tournaments</p></div>';
                }
            } catch (e) {
                console.error('Error:', e);
                document.getElementById('standingsContent').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>Unable to load standings</p></div>';
            }
        }
        
        function showTournament(tid) {
            currentTournamentId = tid;
            
            // Update active tab
            document.querySelectorAll('.tournament-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.textContent === tournamentData.tournaments[tid]?.name) {
                    tab.classList.add('active');
                }
            });
            
            const tour = tournamentData.tournaments[tid];
            if (!tour) {
                document.getElementById('standingsContent').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>Tournament not found</p></div>';
                return;
            }
            
            // Build teams array
            const teams = [];
            (tour.teams || []).forEach(teamId => {
                const team = tournamentData.teams[teamId];
                if (team) {
                    teams.push({ id: teamId, ...team });
                }
            });
            
            // Sort by points
            teams.sort((a, b) => (b.total_points || 0) - (a.total_points || 0));
            
            const content = document.getElementById('standingsContent');
            content.innerHTML = '';
            
            if (teams.length === 0) {
                content.innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><p>No teams registered yet</p></div>';
                return;
            }
            
            teams.forEach((team, index) => {
                const rank = index + 1;
                const matches = team.matches_played || [];
                const totalKills = matches.reduce((sum, m) => sum + (m.kills || 0), 0);
                
                let rankClass = '';
                if (rank === 1) rankClass = 'first';
                else if (rank === 2) rankClass = 'second';
                else if (rank === 3) rankClass = 'third';
                
                const row = document.createElement('div');
                row.className = 'leaderboard-row' + (rank <= 3 ? ' top-3' : '');
                row.innerHTML = `
                    <div class="rank ${rankClass}">#${rank}</div>
                    <div class="team-name-cell">
                        <span class="team-name">${team.name}</span>
                        ${team.match_point_eligible ? '<span class="match-point-badge">⚡ Match Point</span>' : ''}
                    </div>
                    <div class="stat-cell">${team.total_points || 0}</div>
                    <div class="stat-cell hide-mobile">${matches.length}</div>
                    <div class="stat-cell">${totalKills}</div>
                `;
                content.appendChild(row);
            });
        }
        
        window.addEventListener('load', () => {
            createParticles();
            loadStandings();
            setInterval(loadStandings, 30000);
        });
    </script>
</body>
</html>
